              Spacer(Modifier.height(8.dp))
              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                  Pill("🔁 Neu") { vm.regenerate(m) }
                  Pill("💾 Speichern") { vm.saveImage(img) }
                  Pill(if (m.learned) "✅ Gemerkt" else "👍 Lernen") { vm.learn(m) }
              }
          }

          @Composable
          fun Thinking(stage: String) {
              val t = rememberInfiniteTransition(label = "think")
              val pulse by t.animateFloat(0.85f, 1.15f, infiniteRepeatable(tween(700), RepeatMode.Reverse), label = "pulse")
              val rot by t.animateFloat(0f, 360f, infiniteRepeatable(tween(2200, easing = LinearEasing)), label = "rot")
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Box(
                      Modifier.size(34.dp)
                          .graphicsLayer { scaleX = pulse; scaleY = pulse; rotationZ = rot }
                          .clip(CircleShape)
                          .background(Brush.sweepGradient(listOf(P.violet, P.cyan, P.pink, P.violet)))
                  )
                  Spacer(Modifier.width(12.dp))
                  T(if (stage.isEmpty()) "Denke nach…" else stage, P.dim, 13)
              }
          }

          @Composable
          fun RevealImage(m: Msg, img: android.graphics.Bitmap) {
              var idx by remember { mutableIntStateOf(if (m.revealed) m.frames.size else 0) }
              LaunchedEffect(m.id) {
                  if (!m.revealed) {
                      for (i in m.frames.indices) {
                          idx = i
                          delay(170)
                      }
                      idx = m.frames.size
                      m.revealed = true
                  }
              }
              val showFinal = idx >= m.frames.size
              val tr = rememberInfiniteTransition(label = "glow")
              val phase by tr.animateFloat(0f, 600f, infiniteRepeatable(tween(1600, easing = LinearEasing)), label = "phase")
              val shape = RoundedCornerShape(20.dp)
              val borderBrush = if (showFinal) Brush.linearGradient(listOf(P.violet.copy(alpha = 0.6f), P.cyan.copy(alpha = 0.6f)))
              else Brush.linearGradient(
                  listOf(P.violet, P.cyan, P.pink, P.violet),
                  start = Offset(phase - 300f, 0f), end = Offset(phase + 300f, 600f)
              )
              Box(Modifier.size(260.dp).clip(shape).border(2.dp, borderBrush, shape)) {
                  if (showFinal) {
                      Image(img.asImageBitmap(), null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop, filterQuality = FilterQuality.High)
                  } else {
                      Image(m.frames[idx].asImageBitmap(), null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop, filterQuality = FilterQuality.None)
                      Canvas(Modifier.fillMaxSize()) {
                          val y = size.height * ((idx + 1f) / m.frames.size)
                          drawRect(
                              Brush.verticalGradient(
                                  listOf(Color.Transparent, P.cyan.copy(alpha = 0.5f), Color.Transparent),
                                  startY = y - 40f, endY = y + 40f
                              ),
                              topLeft = Offset(0f, y - 40f), size = Size(size.width, 80f)
                          )
                      }
                  }
              }
          }

          // ------------------------------------------------------------------ Bibliothek

          @OptIn(ExperimentalLayoutApi::class)
          @Composable
          fun LibraryScreen(vm: AppVM) {
              var pending by remember { mutableStateOf<List<Uri>>(emptyList()) }
              val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetMultipleContents()) { uris ->
                  if (uris.isNotEmpty()) pending = uris
              }
              Column(Modifier.fillMaxSize()) {
                  Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Box(
                          Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp)).background(P.grad)
                              .clickable { picker.launch("image/*") }.padding(vertical = 14.dp),
                          contentAlignment = Alignment.Center
                      ) { T("＋  Bilder hochladen & beschriften", Color.White, 15, FontWeight.Bold) }
                      val tags = vm.topTags(12)
                      if (tags.isNotEmpty()) {
                          FlowRow(horizontalArrangement = Arrangement.spacedBy(6.dp), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              tags.forEach { (t, n) ->
                                  Box(Modifier.clip(RoundedCornerShape(50)).background(P.card2).padding(horizontal = 10.dp, vertical = 5.dp)) {
                                      T("#$t · $n", P.cyan, 11)
                                  }
                              }
                          }
                      }
                  }
                  if (vm.items.isEmpty()) {
                      Box(Modifier.weight(1f).fillMaxWidth().padding(30.dp), contentAlignment = Alignment.Center) {
                          T(
                              "Noch leer.\nLade Bilder mit Stichwörtern hoch (z. B. „Sonnenuntergang rot Meer“). Je mehr Bilder pro Stichwort, desto besser lerne ich.",
                              P.dim, 14, a = TextAlign.Center
                          )
                      }
                  } else {
                      LazyVerticalGrid(
                          columns = GridCells.Fixed(3),
                          modifier = Modifier.weight(1f),
                          contentPadding = PaddingValues(12.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          items(vm.items, key = { it.id }) { item ->
                              Column {
                                  val shape = RoundedCornerShape(14.dp)
                                  Box(Modifier.fillMaxWidth().aspectRatio(1f).clip(shape).border(1.dp, P.line, shape)) {
                                      Image(
                                          item.bmp.asImageBitmap(), null, Modifier.fillMaxSize(),
                                          contentScale = ContentScale.Crop, filterQuality = FilterQuality.Low
                                      )
                                      Box(
                                          Modifier.align(Alignment.TopEnd).padding(4.dp).size(22.dp).clip(CircleShape)
                                              .background(Color.Black.copy(alpha = 0.6f)).clickable { vm.remove(item) },
                                          contentAlignment = Alignment.Center
                                      ) { T("✕", Color.White, 11) }
                                  }
                                  T(item.tags.joinToString(" · "), P.dim, 10)
                              }
                          }
                      }
                  }
              }
              if (pending.isNotEmpty()) {
                  TagDialog(
                      count = pending.size,
                      onCancel = { pending = emptyList() },
                      onOk = { tags -> vm.addImages(pending, tags); pending = emptyList() }
                  )
              }
          }

          @Composable
          fun TagDialog(count: Int, onCancel: () -> Unit, onOk: (String) -> Unit) {
              var tags by remember { mutableStateOf("") }
              val shape = RoundedCornerShape(14.dp)
              AlertDialog(
                  onDismissRequest = onCancel,
                  containerColor = P.card,
                  title = { T("$count Bild(er) beschriften", sz = 18, w = FontWeight.Bold) },
                  text = {
                      Column {
                          T("Stichwörter für alle gewählten Bilder (mit Leerzeichen oder Komma trennen):", P.dim, 13)
                          Spacer(Modifier.height(10.dp))
                          Box(Modifier.fillMaxWidth().clip(shape).background(P.card2).border(1.dp, P.line, shape).padding(12.dp)) {
                              if (tags.isEmpty()) T("z. B. sonnenuntergang rot meer", P.dim, 14)
                              BasicTextField(
                                  value = tags, onValueChange = { tags = it },
                                  textStyle = TextStyle(color = P.text, fontSize = 15.sp),
                                  cursorBrush = SolidColor(P.cyan), modifier = Modifier.fillMaxWidth()
                              )
                          }
                      }
                  },
                  confirmButton = { Pill("Hinzufügen", true) { onOk(tags) } },
                  dismissButton = { Pill("Abbrechen") { onCancel() } }
              )
          }

          // ------------------------------------------------------------------ Training

          @Composable
          fun TrainScreen(vm: AppVM) {
              val view = LocalView.current
              SideEffect { view.keepScreenOn = vm.training }
              var epochs by remember { mutableFloatStateOf(60f) }
              var confirmReset by remember { mutableStateOf(false) }
              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(14.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Stat("Bilder", vm.items.size.toString(), Modifier.weight(1f))
                      Stat("Epochen", vm.trainedEpochs.toString(), Modifier.weight(1f))
                      Stat("Loss", if (vm.lossHistory.isEmpty()) "–" else "%.3f".format(vm.loss), Modifier.weight(1f))
                  }
                  Panel {
                      T("Live-Vorschau", P.text, 15, FontWeight.Bold)
                      Spacer(Modifier.height(10.dp))
                      val shape = RoundedCornerShape(18.dp)
                      Box(
                          Modifier.size(200.dp).align(Alignment.CenterHorizontally).clip(shape).background(P.card2).border(1.dp, P.line, shape),
                          contentAlignment = Alignment.Center
                      ) {
                          val p = vm.preview
                          if (p != null) Image(p.asImageBitmap(), null, Modifier.fillMaxSize(), contentScale = ContentScale.Crop, filterQuality = FilterQuality.High)
                          else T("Noch keine Vorschau", P.dim, 12)
                      }
                  }
                  Panel {
                      T("Lernkurve", P.text, 15, FontWeight.Bold)
                      Spacer(Modifier.height(8.dp))
                      val h = vm.lossHistory.toList()
                      Canvas(Modifier.fillMaxWidth().height(110.dp)) {
                          if (h.size < 2) return@Canvas
                          val mx = h.max()
                          val mn = h.min()
                          val rng = (mx - mn).coerceAtLeast(1e-6f)
                          val path = Path()
                          h.forEachIndexed { i, v ->
                              val x = size.width * i / (h.size - 1)
                              val y = size.height * 0.05f + size.height * 0.9f * (1f - (v - mn) / rng)
                              if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                          }
                          drawPath(path, P.grad, style = Stroke(width = 4f, cap = StrokeCap.Round))
                      }
                  }
                  Panel {
                      T("Training", P.text, 15, FontWeight.Bold)
                      Spacer(Modifier.height(6.dp))
                      if (vm.training) {
                          val frac = if (vm.totalEp == 0) 0f else vm.epoch.toFloat() / vm.totalEp
                          Box(Modifier.fillMaxWidth().height(8.dp).clip(RoundedCornerShape(50)).background(P.card2)) {
                              Box(Modifier.fillMaxWidth(frac.coerceIn(0.02f, 1f)).height(8.dp).clip(RoundedCornerShape(50)).background(P.grad))
                          }
                          Spacer(Modifier.height(6.dp))
                          T("Epoche ${vm.epoch} / ${vm.totalEp} – Bildschirm bleibt an", P.dim, 12)
                      } else {
                          T("Epochen: ${epochs.toInt()}", P.dim, 13)
                          Slider(
                              value = epochs, onValueChange = { epochs = it }, valueRange = 5f..300f,
                              colors = SliderDefaults.colors(thumbColor = P.cyan, activeTrackColor = P.violet, inactiveTrackColor = P.card2)
                          )
                      }
                      Spacer(Modifier.height(8.dp))
                      Box(
                          Modifier.fillMaxWidth().clip(RoundedCornerShape(16.dp))
                              .background(if (vm.training) SolidColor(Color(0xFFB91C1C)) else P.grad)
                              .clickable { if (vm.training) vm.stopTraining() else vm.startTraining(epochs.toInt()) }
                              .padding(vertical = 14.dp),
                          contentAlignment = Alignment.Center
                      ) {
                          T(if (vm.training) "⏹  Training stoppen" else "▶  Training starten", Color.White, 16, FontWeight.Bold)
                      }
                      Spacer(Modifier.height(8.dp))
                      T(
                          "Tipp: Pro Stichwort mindestens 10–20 Bilder, dann 100+ Epochen. Training kann jederzeit fortgesetzt werden – der Fortschritt wird gespeichert.",
                          P.dim, 12
                      )
                  }
                  Pill("🗑 Modell zurücksetzen") { confirmReset = true }
                  Spacer(Modifier.height(8.dp))
              }
              if (confirmReset) {
                  AlertDialog(
                      onDismissRequest = { confirmReset = false },
                      containerColor = P.card,
                      title = { T("Modell zurücksetzen?", sz = 18, w = FontWeight.Bold) },
                      text = { T("Alles Gelernte geht verloren. Deine Bilder in der Bibliothek bleiben erhalten.", P.dim, 14) },
                      confirmButton = { Pill("Zurücksetzen", true) { vm.resetModel(); confirmReset = false } },
                      dismissButton = { Pill("Abbrechen") { confirmReset = false } }
                  )
              }
          }
