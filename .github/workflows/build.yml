          package com.neuroforge.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.ImageDecoder
          import android.net.Uri
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.util.UUID
          import kotlin.math.max
          import kotlin.math.min

          class Item(val id: String, val tags: List<String>, val bmp: Bitmap) {
              val px: FloatArray = Pix.toFloats(bmp)
          }

          object Pix {
              fun load(ctx: Context, uri: Uri): Bitmap {
                  val src = ImageDecoder.createSource(ctx.contentResolver, uri)
                  val bmp = ImageDecoder.decodeBitmap(src) { dec, info, _ ->
                      dec.setAllocator(ImageDecoder.ALLOCATOR_SOFTWARE)
                      val w = info.size.width
                      val h = info.size.height
                      val sc = min(1f, 512f / max(w, h))
                      dec.setTargetSize(max(1, (w * sc).toInt()), max(1, (h * sc).toInt()))
                  }
                  return prepare(bmp)
              }

              fun prepare(src: Bitmap): Bitmap {
                  val m = min(src.width, src.height)
                  var cur = Bitmap.createBitmap(src, (src.width - m) / 2, (src.height - m) / 2, m, m)
                  while (cur.width >= Cfg.S * 2) {
                      cur = Bitmap.createScaledBitmap(cur, max(Cfg.S, cur.width / 2), max(Cfg.S, cur.height / 2), true)
                  }
                  if (cur.width != Cfg.S) cur = Bitmap.createScaledBitmap(cur, Cfg.S, Cfg.S, true)
                  return cur.copy(Bitmap.Config.ARGB_8888, false)
              }

              fun toFloats(b: Bitmap): FloatArray {
                  val s = Cfg.S
                  val p = IntArray(s * s)
                  b.getPixels(p, 0, s, 0, 0, s, s)
                  val out = FloatArray(Cfg.D)
                  for (i in p.indices) {
                      val c = p[i]
                      out[i * 3] = ((c shr 16) and 255) / 255f
                      out[i * 3 + 1] = ((c shr 8) and 255) / 255f
                      out[i * 3 + 2] = (c and 255) / 255f
                  }
                  return out
              }
          }

          class Store(ctx: Context) {
              private val dir = File(ctx.filesDir, "data").apply { mkdirs() }
              private val idx = File(dir, "index.json")

              fun load(): List<Item> {
                  val out = ArrayList<Item>()
                  try {
                      if (!idx.exists()) return out
                      val arr = JSONArray(idx.readText())
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val id = o.getString("id")
                          val ta = o.getJSONArray("tags")
                          val tags = (0 until ta.length()).map { ta.getString(it) }
                          val bmp = BitmapFactory.decodeFile(File(dir, "$id.png").path) ?: continue
                          if (bmp.width != Cfg.S || bmp.height != Cfg.S) continue
                          out.add(Item(id, tags, bmp))
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }

              fun persist(items: List<Item>) {
                  val arr = JSONArray()
                  for (it in items) {
                      val o = JSONObject()
                      o.put("id", it.id)
                      o.put("tags", JSONArray(it.tags))
                      arr.put(o)
                  }
                  idx.writeText(arr.toString())
              }

              fun create(bmp: Bitmap, tags: List<String>): Item {
                  val id = UUID.randomUUID().toString().replace("-", "")
                  FileOutputStream(File(dir, "$id.png")).use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  return Item(id, tags, bmp)
              }

              fun remove(item: Item) {
                  File(dir, "${item.id}.png").delete()
              }
          }
